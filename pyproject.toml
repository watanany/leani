[project]
name = "leani"
version = "0.1.0"
description = "Lean 4 の対話 REPL"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leani = "leani:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/leani.py"]
sources = ["src"]

[dependency-groups]
dev = ["pytest>=8", "pytest-describe>=2.2", "pytest-mock>=3.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
