[project]
name = "leani"
version = "0.1.0"
description = "Lean 4 の対話 REPL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/watanany/leani"
Repository = "https://github.com/watanany/leani"

[project.scripts]
leani = "leani:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/leani.py"]
sources = ["src"]

[dependency-groups]
dev = ["pytest>=8", "pytest-describe>=2.2", "pytest-mock>=3.14", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# RET505 (return のあとの elif) は入れない。分岐は明示的に else で書く方針。
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 定数を読む前に環境変数を決める必要があるので、import が先頭に来ない。
"tests/conftest.py" = ["E402"]
