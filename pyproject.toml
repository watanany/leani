[project]
name = "leani"
version = "0.1.0"
description = "Lean 4 の対話 REPL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.53",
]

[project.urls]
Homepage = "https://github.com/watanany/leani"
Repository = "https://github.com/watanany/leani"

[project.scripts]
leani = "leani.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/leani"]
sources = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=2.3.1",
    "pyte>=0.8.2",
    "pytest>=8",
    "pytest-describe>=2.2",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tools"]
# tools/spec.py は tests/stories.py を読む (実行時は sys.path に足している)。
mypy_path = "tests"
# テストは strict の対象にしない。pytest の fixture ごとに注釈を書くことになり、
# 得られるものより手間が勝る。落ちれば pytest が教える。

[tool.pyright]
# エディタ用。.venv と、src / tests への import を解決させる。
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# 入れなかったもの。どれも既定では推奨されるが、このリポジトリの方針が先に来る。
#   RET505           return のあとの elif。分岐は明示的に else で書いている
#   N802 / PLC2401   日本語のテスト名。これが SPEC.md の見出しになる
#   PTH              os.path で通している
#   EM / TRY003      例外の文言は、そのまま読ませるために呼び出し側で組む
#   D / ANN          docstring と型注釈は要る所に手で付ける
#   S101             テストの assert
#   T201             これは print する CLI
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "TID",
    "C4", "PIE", "PERF", "FLY", "FURB", "RUF", "PLE", "PLW", "PT", "ISC",
]
# RUF001-003 は日本語と数学記号を「紛らわしい文字」として全部落とす。
# ISC001 は formatter と衝突する (行を分けるのは formatter の仕事)。
ignore = ["RUF001", "RUF002", "RUF003", "ISC001"]

[tool.ruff.lint.flake8-tidy-imports]
# 相対 import を禁じるのは好みではなく、下の banned-api を効かせるため。
# `from .engine import X` は TID251 をすり抜ける。
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ラベルの向き: 純粋・読み取り・定数 は 副作用 を import しない。
"leani.boot".msg = "純粋・読み取り・定数のモジュールは、副作用のモジュールを import しない"
"leani.engine".msg = "純粋・読み取り・定数のモジュールは、副作用のモジュールを import しない"
"leani.repl".msg = "純粋・読み取り・定数のモジュールは、副作用のモジュールを import しない"
"leani.search".msg = "純粋・読み取り・定数のモジュールは、副作用のモジュールを import しない"
"leani.cli".msg = "純粋・読み取り・定数のモジュールは、副作用のモジュールを import しない"
"leani.show".msg = "純粋・読み取り・定数のモジュールは、副作用のモジュールを import しない"

[tool.ruff.lint.per-file-ignores]
# 副作用のモジュールどうしは呼び合ってよい。名前をまとめる __init__ とテストも外す。
"src/leani/boot.py" = ["TID251"]
"src/leani/engine.py" = ["TID251"]
"src/leani/search.py" = ["TID251"]
"src/leani/show.py" = ["TID251"]
"src/leani/repl.py" = ["TID251"]
"src/leani/cli.py" = ["TID251"]
"src/leani/__init__.py" = ["TID251"]
"src/leani/__main__.py" = ["TID251"]
"tests/**" = ["TID251"]
