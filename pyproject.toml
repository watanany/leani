[project]
name = "leani"
version = "0.1.0"
description = "Lean 4 の対話 REPL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.53",
]

[project.urls]
Homepage = "https://github.com/watanany/leani"
Repository = "https://github.com/watanany/leani"

[project.scripts]
leani = "leani.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/leani"]
sources = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyte>=0.8.2",
    "pytest>=8",
    "pytest-describe>=2.2",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tools"]
# tools/spec.py は tests/stories.py を読む (実行時は sys.path に足している)。
mypy_path = "tests"
# テストは strict の対象にしない。pytest の fixture ごとに注釈を書くことになり、
# 得られるものより手間が勝る。落ちれば pytest が教える。

[tool.pyright]
# エディタ用。.venv と、src / tests への import を解決させる。
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# RET505 (return のあとの elif) は入れない。分岐は明示的に else で書く方針。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# 相対 import を禁じるのは好みではなく、下の banned-api を効かせるため。
# `from .engine import X` は TID251 をすり抜ける。
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 札の向き: 純粋・読み取り・定数 は 副作用 を import しない。
"leani.boot".msg = "純粋・読み取り・定数の節は、副作用の節を import しない"
"leani.engine".msg = "純粋・読み取り・定数の節は、副作用の節を import しない"
"leani.repl".msg = "純粋・読み取り・定数の節は、副作用の節を import しない"
"leani.cli".msg = "純粋・読み取り・定数の節は、副作用の節を import しない"
"leani.show".msg = "純粋・読み取り・定数の節は、副作用の節を import しない"

[tool.ruff.lint.per-file-ignores]
# 定数を読む前に環境変数を決める必要があるので、import が先頭に来ない。
"tests/conftest.py" = ["E402"]
# 副作用の節どうしは呼び合ってよい。名前をまとめる __init__ とテストも外す。
"src/leani/boot.py" = ["TID251"]
"src/leani/engine.py" = ["TID251"]
"src/leani/show.py" = ["TID251"]
"src/leani/repl.py" = ["TID251"]
"src/leani/cli.py" = ["TID251"]
"src/leani/__init__.py" = ["TID251"]
"src/leani/__main__.py" = ["TID251"]
"tests/**" = ["TID251"]
