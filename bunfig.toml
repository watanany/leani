# bun fmt で整形しないファイル。
# - .claude/: AI が Edit で直す。just check で確かめるだけにする (justfile の check)
# - SPEC.ja.md と SPEC.en.md: crates/spec が生成する
# - crates/leani-core/abbrev.json と、その symlink の src/leani/abbrev.json: Lean から写したデータ
# - pyproject.toml: uv が書き戻す
# - vendor/: 外から取り込んだコード
[fmt]
ignorePatterns = [
  ".claude/**",
  "SPEC.ja.md",
  "SPEC.en.md",
  "crates/leani-core/abbrev.json",
  "src/leani/abbrev.json",
  "pyproject.toml",
  "vendor/**",
]
