# ユーザーストーリー。leani が誰の何を助けるかの一覧。テストとの対応の付け方は `crates/spec` の doc に書いてある。

# 機能そのものが無いもの。テストが 0 件なのは当然で、足りていないのは実装。
unbuilt = ["C4"]

[[group]]
id = "A"
ja = "式を試す"

[[group]]
id = "B"
ja = "スクリプトを少しずつ組み立てる"

[[group]]
id = "C"
ja = "複数行の宣言を書く"

[[group]]
id = "D"
ja = "名前と型を探す"

[[group]]
id = "E"
ja = "証明する"

[[group]]
id = "F"
ja = "失敗してもセッションを続ける"

[[group]]
id = "G"
ja = "起動と設定"

[[group]]
id = "H"
ja = "コマンドを知る"

[[group]]
id = "J"
ja = "ノートブックで使う"

[[group]]
id = "X"
ja = "保守 (ユーザーストーリーではない)"

[[story]]
id = "A1"
ja = "式の値をすぐ知りたい。ファイルを作って lake env lean を実行する手間を省く"

[[story]]
id = "A2"
ja = "評価できないとき、なぜできないのか (noncomputable か Repr 無し) を知りたい"

[[story]]
id = "A3"
ja = "結果が出るまでの時間を知りたい。重い計算を切り分けたい"

[[story]]
id = "A4"
ja = "重い計算を Ctrl-C で止めて、それまでの宣言は失わずに続けたい"

[[story]]
id = "A5"
ja = "エラーがあったとき、入力のどこが悪いのかを行の中で知りたい"

[[story]]
id = "B1"
