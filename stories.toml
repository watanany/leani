[[story]]
id = "B3"
ja = "組み立て終わったものを .lean ファイルに書き出し、そのまま実行したい"

[[story]]
id = "B4"
ja = "すでにあるファイルを読み込んで関数を呼びたい。編集したら読み込み直したい"

[[story]]
id = "B5"
